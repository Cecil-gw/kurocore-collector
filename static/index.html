<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kurocore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0f;--surface:#12121a;--surface2:#1a1a26;--border:#252535;--border-hover:#3a3a50;--text:#e8e8f0;--text2:#9a9ab0;--text3:#5c5c74;--accent:#7c6ee6;--accent-hover:#9488f0;--accent-bg:rgba(124,110,230,.08);--danger:#e5484d;--success:#30a46c;--radius:10px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.top-wrapper{position:sticky;top:0;z-index:100}
.header{background:rgba(18,18,26,.92);padding:10px 20px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--border);backdrop-filter:blur(16px)}
.logo{font-size:1em;font-weight:600;color:var(--accent);white-space:nowrap;letter-spacing:-.5px}
.logo span{color:var(--text2);font-weight:400}
.search-wrap{flex:1;display:flex;gap:6px;max-width:620px;position:relative}
.search-wrap input{flex:1;padding:8px 14px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg);color:var(--text);font-size:13px;outline:none;transition:border-color .15s}
.search-wrap input:focus{border-color:var(--accent)}
.search-wrap input::placeholder{color:var(--text3)}
.icon-btn{padding:8px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:all .15s;line-height:1}
.icon-btn:hover{border-color:var(--accent);background:var(--accent-bg)}
.btn{padding:7px 16px;border:none;border-radius:var(--radius);cursor:pointer;font-size:12px;font-weight:500;transition:all .15s;font-family:inherit}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-hover)}
.btn-primary:disabled{opacity:.4;cursor:not-allowed}
.btn-outline{background:transparent;color:var(--text2);border:1px solid var(--border)}
.btn-outline:hover{border-color:var(--border-hover);color:var(--text)}
.btn-danger{background:transparent;color:var(--danger);border:1px solid transparent}
.btn-danger:hover{border-color:var(--danger);background:rgba(229,72,77,.06)}
.btn-success{background:var(--success);color:#fff}
.btn-success:hover{background:#3cb87e}
.stats{padding:5px 20px;font-size:11px;color:var(--text3);background:rgba(18,18,26,.92);border-bottom:1px solid var(--border);display:flex;gap:16px}
.stats span b{color:var(--text2);font-weight:500}
.pagenav{display:flex;align-items:center;justify-content:center;gap:10px;padding:6px 0;background:rgba(18,18,26,.92);border-bottom:1px solid var(--border);display:none}
.pagenav .ind{font-size:12px;color:var(--text2);min-width:120px;text-align:center}
.pagenav button{background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text2);padding:5px 14px;cursor:pointer;font-size:12px;transition:all .15s}
.pagenav button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.pagenav button:disabled{opacity:.3;cursor:not-allowed}
.container{padding:14px 20px;max-width:1400px;margin:0 auto}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.toolbar .info{font-size:12px;color:var(--text2)}
.toolbar .actions{display:flex;gap:6px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.card{background:var(--surface);border-radius:var(--radius);overflow:hidden;border:1.5px solid transparent;cursor:pointer;transition:all .2s;position:relative}
.card:hover{border-color:var(--accent);transform:translateY(-2px)}
.card.selected{border-color:var(--accent);background:var(--accent-bg)}
.card img{width:100%;aspect-ratio:3/4;object-fit:cover;background:var(--surface2);display:block}
.card .check{position:absolute;top:6px;left:6px;width:20px;height:20px;border-radius:50%;border:2px solid rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center;font-size:11px;background:rgba(0,0,0,.4);transition:all .15s;z-index:2}
.card.selected .check{background:var(--accent);border-color:var(--accent)}
.card .check::after{content:'';width:8px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px);opacity:0}
.card.selected .check::after{opacity:1}
.card .badge{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.7);color:var(--text2);font-size:10px;padding:1px 6px;border-radius:4px;backdrop-filter:blur(4px)}
.card .meta{padding:6px 8px 8px}
.card .meta .title{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text2);font-weight:500}
.card .meta .author{font-size:10px;color:var(--text3);margin-top:2px}
.empty{text-align:center;padding:80px 20px;color:var(--text3)}
.empty p{font-size:14px;margin-top:6px}
.lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.lib-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;font-size:11px;transition:border-color .15s;cursor:pointer;position:relative}
.lib-item:hover{border-color:var(--accent)}
.lib-item.selected{border-color:var(--danger);background:rgba(229,72,77,.04)}
.lib-item .check{position:absolute;top:6px;left:6px;width:20px;height:20px;border-radius:50%;border:2px solid rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center;font-size:11px;background:rgba(0,0,0,.4);transition:all .15s;z-index:2}
.lib-item.selected .check{background:var(--danger);border-color:var(--danger)}
.lib-item .check::after{content:'';width:8px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px);opacity:0}
.lib-item.selected .check::after{opacity:1}
.lib-item img{width:100%;aspect-ratio:3/4;object-fit:cover;background:var(--surface2);display:block}
.lib-item .lib-meta{padding:8px 10px}
.lib-item .lib-meta .t{color:var(--text2);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lib-item .lib-meta .a{color:var(--text3);margin-top:2px}
.lib-item .lib-meta a{color:var(--accent);text-decoration:none;font-size:10px}
.lib-item .lib-meta a:hover{text-decoration:underline}
.contact-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:4px}
.contact-item{position:relative;border-radius:6px;overflow:hidden;border:1px solid var(--border);transition:all .12s;cursor:pointer;aspect-ratio:3/4}
.contact-item:hover{border-color:var(--accent);transform:scale(1.02)}
.contact-item img{width:100%;height:100%;object-fit:cover;display:block}
.contact-item .idx{position:absolute;bottom:2px;right:3px;font-size:9px;color:#fff;background:rgba(0,0,0,.6);padding:0 4px;border-radius:3px}
.tags-row{display:flex;flex-wrap:wrap;gap:5px;padding:6px 20px;background:rgba(18,18,26,.92);border-bottom:1px solid var(--border);align-items:center}
.tags-row .label{font-size:10px;color:var(--text3);white-space:nowrap;min-width:36px}
.chip{padding:2px 9px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;color:var(--text3);font-size:11px;cursor:pointer;transition:all .12s;font-family:inherit}
.chip:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-bg)}
.chip.history{background:var(--accent-bg);border-color:rgba(124,110,230,.15);color:var(--accent)}
.chip.history:hover{background:rgba(124,110,230,.12)}
.suggest-box{position:absolute;top:100%;left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-top:4px;max-height:200px;overflow-y:auto;display:none;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.6)}
.suggest-box.active{display:block}
.suggest-item{padding:6px 12px;cursor:pointer;font-size:12px;color:var(--text2);transition:background .08s}
.suggest-item:hover,.suggest-item.hl{background:var(--accent-bg);color:var(--accent)}
.nav-tabs{margin-left:auto;display:flex;gap:2px;background:var(--surface2);border-radius:var(--radius);padding:3px}
.nav-tabs button{background:none;border:none;color:var(--text3);padding:5px 14px;border-radius:7px;cursor:pointer;font-size:12px;transition:all .15s;font-family:inherit;display:flex;align-items:center;gap:5px}
.nav-tabs button.active{background:var(--accent);color:#fff}
.nav-tabs button:not(.active):hover{color:var(--text)}
.nav-tabs button svg{width:13px;height:13px}
.settings-wrap{position:relative}
.settings-panel{position:absolute;right:0;top:110%;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;min-width:200px;display:none;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.6)}
.settings-panel.active{display:block}
.settings-panel h3{font-size:11px;color:var(--text3);margin-bottom:10px;font-weight:500;text-transform:uppercase;letter-spacing:.5px}
.settings-row{display:flex;align-items:center;justify-content:space-between;padding:6px 0}
.settings-row .label{font-size:12px;color:var(--text)}
.settings-row .desc{font-size:10px;color:var(--text3);display:block;margin-top:1px}
.toggle{position:relative;width:36px;height:20px;cursor:pointer;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0}
.toggle .slider{position:absolute;inset:0;background:var(--border);border-radius:10px;transition:.2s}
.toggle .slider::before{content:'';position:absolute;width:14px;height:14px;left:3px;bottom:3px;background:var(--text3);border-radius:50%;transition:.2s}
.toggle input:checked+.slider{background:var(--accent)}
.toggle input:checked+.slider::before{transform:translateX(16px);background:#fff}
.progress-wrap{background:var(--surface);padding:8px 20px;border-bottom:2px solid var(--accent);display:none}
.progress-wrap.active{display:block}
.progress-wrap .text{font-size:12px;color:var(--text)}
.progress-wrap .detail{font-size:11px;color:var(--text3);margin-top:2px}
.progress-wrap .bar-bg{height:3px;background:var(--border);border-radius:2px;margin-top:6px}
.progress-wrap .bar-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-hover));border-radius:2px;transition:width .3s}
.progress-wrap .errors{max-height:60px;overflow-y:auto;margin-top:4px;font-size:11px}
.progress-wrap .error-item{color:var(--danger);padding:1px 0}
.loading-ov{position:fixed;inset:0;background:rgba(10,10,15,.85);display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;z-index:300;backdrop-filter:blur(4px)}
.loading-ov.active{display:flex}
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-ov p{color:var(--text3);font-size:13px}
.tab-panel{display:none}.tab-panel.active{display:block}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--border-hover)}
</style>
</head>
<body>
<div class="top-wrapper">
<div class="header">
  <div class="logo">Kuro<span>core</span></div>
  <div class="search-wrap">
    <input id="searchInput" placeholder="搜索标签、角色名…" onkeydown="if(event.key==='Enter')doSearch()">
    <div class="suggest-box" id="suggestBox"></div>
    <button class="btn btn-primary" onclick="doSearch()">搜索</button>
    <button class="icon-btn" onclick="doRandom()" title="随机">🎲</button>
    <button class="icon-btn" onclick="doRandomGirl()" title="随机美少女">🌸</button>
  </div>
  <div class="settings-wrap">
    <button class="icon-btn" onclick="toggleSettings(event)" title="设置">⚙</button>
    <div class="settings-panel" id="settingsPanel">
      <h3>Settings</h3>
      <div class="settings-row">
        <div><div class="label">过滤 R-18</div><span class="desc">隐藏敏感内容</span></div>
        <label class="toggle"><input type="checkbox" id="safeMode" onchange="toggleSafe()" checked><span class="slider"></span></label>
      </div>
    </div>
  </div>
  <div class="nav-tabs">
    <button id="tabSearch" class="active" onclick="switchTab('search')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>搜索</button>
    <button id="tabLibrary" onclick="switchTab('library')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>图库</button>
    <button id="tabContact" onclick="switchTab('contact')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>联系表</button>
  </div>
</div>
<div class="stats" id="statsBar"></div>
<div class="tags-row"><span class="label">最近</span><span id="historyChips" style="display:flex;flex-wrap:wrap;gap:5px"></span></div>
<div class="tags-row"><span class="label">热门</span><span id="hotTagChips" style="display:flex;flex-wrap:wrap;gap:5px"></span></div>
<div class="progress-wrap" id="progressBar">
  <div class="text" id="progressText"></div>
  <div class="detail" id="progressDetail"></div>
  <div class="bar-bg"><div class="bar-fill" id="progressFill" style="width:0%"></div></div>
  <div class="errors" id="errorList"></div>
</div>
</div>
<div class="container">
  <div id="panelSearch" class="tab-panel active">
    <div class="toolbar" id="toolbar" style="display:none">
      <div class="info" id="pageInfo"></div>
      <div class="actions">
        <button class="btn btn-outline" onclick="selectAll()">全选</button>
        <button class="btn btn-outline" onclick="deselectAll()">取消</button>
        <button class="btn btn-success" id="randomCollectBtn" onclick="randomCollect()">🎲 随机采集</button>
        <button class="btn btn-success" id="autoDlBtn" onclick="autoDownload()">⚡ 全部下载</button>
        <button class="btn btn-primary" id="downloadBtn" onclick="startDownload()" disabled>下载 (<span id="selCount">0</span>)</button>
      </div>
    </div>
    <div class="pagenav" id="pagenav">
      <button id="prevPageBtn" onclick="flipPage(-1)" disabled>← 上一页</button>
      <span class="ind" id="pageIndicator"></span>
      <button id="nextPageBtn" onclick="flipPage(1)" disabled>下一页 →</button>
    </div>
    <div class="grid" id="resultsGrid"></div>
    <div class="empty" id="emptyMsg"><p>输入关键词开始搜索</p></div>
  </div>
  <div id="panelLibrary" class="tab-panel">
    <div class="toolbar" id="libToolbar" style="display:none">
      <div class="info" id="libInfo"></div>
      <div class="actions">
        <button class="btn btn-outline" onclick="selectLibAll()">全选</button>
        <button class="btn btn-outline" onclick="deselectLibAll()">取消</button>
        <button class="btn btn-danger" id="deleteSelBtn" onclick="deleteSelected()" disabled>删除 (<span id="delCount">0</span>)</button>
        <button class="btn btn-danger" onclick="clearAll()">清空全部</button>
      </div>
    </div>
    <div class="lib-grid" id="libraryGrid"></div>
  </div>
  <div id="panelContact" class="tab-panel">
    <div class="toolbar">
      <div class="info" id="contactInfo"></div>
      <div class="actions"><button class="btn btn-outline" onclick="exportSheet()">导出 PNG</button></div>
    </div>
    <div class="contact-grid" id="contactGrid"></div>
  </div>
</div>
<div class="loading-ov" id="loadingOverlay"><div class="spinner"></div><p id="loadingText"></p></div>
<script>
let currentResults=[],selected=new Set(),query='',nextPage=1,totalSearchPages=1,currentPageStart=1,allSearchResults=[];
let libSelected=new Set(),preloadCache={};
async function fetchStats(){
  const r=await fetch('/api/stats');const d=await r.json();
  const p=await (await fetch('/api/progress')).json();
  document.getElementById('statsBar').innerHTML=`<span><b>${d.completed}</b> 已下载</span><span><b>${d.pending}</b> 待处理</span><span><b>${d.failed}</b> 失败</span><span><b>${p.session_downloads}</b>/<b>${p.session_max}</b> 本会话</span>`;
}
async function doSearch(){
  query=document.getElementById('searchInput').value.trim();if(!query)return;
  fetch(`/api/history?save=${encodeURIComponent(query)}`);
  document.getElementById('emptyMsg').style.display='none';
  document.getElementById('resultsGrid').innerHTML='';
  currentResults=[];allSearchResults=[];selected.clear();preloadCache={};
  document.getElementById('toolbar').style.display='flex';
  document.getElementById('pageInfo').textContent='搜索中…';
  const safe=document.getElementById('safeMode').checked?1:0;
  try{
    const response=await fetch(`/api/search_stream?q=${encodeURIComponent(query)}&start_page=1&pages=9&safe=${safe}`);
    const reader=response.body.getReader();const decoder=new TextDecoder();let buffer='';
    while(true){const{done,value}=await reader.read();if(done)break;
      buffer+=decoder.decode(value,{stream:true});
      const parts=buffer.split('\n\n');buffer=parts.pop();
      for(const part of parts){let event='',data='';
        for(const line of part.split('\n')){if(line.startsWith('event: '))event=line.slice(7);if(line.startsWith('data: '))data=line.slice(6)}
        if(!data)continue;const d=JSON.parse(data);
        if(event==='results'){allSearchResults=allSearchResults.concat(d.results)}
        else if(event==='done'){
          nextPage=d.next_page;totalSearchPages=d.total_pages;
          currentPageStart=1;currentResults=allSearchResults.slice(0,36);
          renderResults();updatePageNav(d,1);
        }else if(event==='error'){document.getElementById('pageInfo').textContent=`❌ ${d.message}`}
      }
    }
  }catch(e){document.getElementById('pageInfo').textContent=`❌ ${e.message}`}
  updateSelCount();
}
function renderResults(){
  const grid=document.getElementById('resultsGrid');grid.innerHTML='';
  currentResults.forEach((r,i)=>{
    const card=document.createElement('div');card.className='card';card.dataset.idx=i;
    const pages=r.page_count>1?`<span class="badge">${r.page_count}p</span>`:'';
    card.innerHTML=`<div class="check"></div>${pages}<img src="/api/thumb?url=${encodeURIComponent(r.thumbnail_url)}" loading="lazy" onerror="this.style.background='#1a1a26'"><div class="meta"><div class="title">${r.title||'Untitled'}</div><div class="author">${r.author_name||''}</div></div>`;
    card.onclick=()=>toggleSelect(i,card);grid.appendChild(card);
  });
}
function toggleSelect(idx,el){const id=currentResults[idx].illust_id;if(selected.has(id)){selected.delete(id);el.classList.remove('selected')}else{selected.add(id);el.classList.add('selected')}updateSelCount()}
function selectAll(){currentResults.forEach((r,i)=>{selected.add(r.illust_id);document.querySelector(`.card[data-idx="${i}"]`)?.classList.add('selected')});updateSelCount()}
function deselectAll(){selected.clear();document.querySelectorAll('.card.selected').forEach(e=>e.classList.remove('selected'));updateSelCount()}
function updateSelCount(){document.getElementById('selCount').textContent=selected.size;document.getElementById('downloadBtn').disabled=selected.size===0}
function updatePageNav(d,startPage){
  const nav=document.getElementById('pagenav');nav.style.display='flex';
  const prevBtn=document.getElementById('prevPageBtn');const nextBtn=document.getElementById('nextPageBtn');
  const indicator=document.getElementById('pageIndicator');
  const endPage=Math.min(startPage+2,d.total_pages);
  indicator.textContent=`${startPage}–${endPage} / ${d.total_pages} 页`;
  nav.style.display='flex';prevBtn.disabled=startPage<=1;nextBtn.disabled=!d.has_more;
  document.getElementById('pageInfo').textContent=`${allSearchResults.length} 条结果`;
  window.scrollTo(0,0);
  if(d.has_more&&nextPage<d.total_pages)setTimeout(()=>preloadPages(nextPage),1000);
}
async function flipPage(dir){
  const newStart=currentPageStart+dir*3;
  if(newStart<1||newStart>totalSearchPages)return;
  currentPageStart=newStart;
  const start=(newStart-1)*12;const end=start+12;
  if(allSearchResults.length>=start){
    currentResults=allSearchResults.slice(start,end);
    renderResults();
    const endP=Math.min(newStart+2,totalSearchPages);
    document.getElementById('pageIndicator').textContent=`${newStart}–${endP} / ${totalSearchPages} 页`;
    document.getElementById('pageInfo').textContent=`${allSearchResults.length} 条结果`;
    document.getElementById('prevPageBtn').disabled=newStart<=1;
    document.getElementById('nextPageBtn').disabled=newStart+3>totalSearchPages;
    window.scrollTo(0,0);
    if(nextPage<totalSearchPages&&allSearchResults.length<end+36){
      const safe=document.getElementById('safeMode').checked?1:0;
      fetch(`/api/search_stream?q=${encodeURIComponent(query)}&start_page=${nextPage}&pages=3&safe=${safe}`)
        .then(r=>r.body.getReader()).then(async reader=>{
          const decoder=new TextDecoder();let buffer='';
          while(true){const{done,value}=await reader.read();if(done)break;
            buffer+=decoder.decode(value,{stream:true});
            const parts=buffer.split('\n\n');buffer=parts.pop();
            for(const part of parts){let event='',data='';
              for(const line of part.split('\n')){if(line.startsWith('event: '))event=line.slice(7);if(line.startsWith('data: '))data=line.slice(6)}
              if(!data)continue;const d2=JSON.parse(data);
              if(event==='results')allSearchResults=allSearchResults.concat(d2.results);
            }
          }
        });
    }
  }else{await loadPages(newStart)}
}
async function loadPages(startPage){
  if(preloadCache[startPage]){
    currentResults=preloadCache[startPage];renderResults();
    document.getElementById('pageIndicator').textContent=`${startPage}–${startPage+2} / ${totalSearchPages} 页`;
    prevBtnNav(startPage);window.scrollTo(0,0);return;
  }
  currentResults=[];const safe=document.getElementById('safeMode').checked?1:0;
  try{
    const response=await fetch(`/api/search_stream?q=${encodeURIComponent(query)}&start_page=${startPage}&pages=3&safe=${safe}`);
    const reader=response.body.getReader();const decoder=new TextDecoder();let buffer='';
    while(true){const{done,value}=await reader.read();if(done)break;
      buffer+=decoder.decode(value,{stream:true});
      const parts=buffer.split('\n\n');buffer=parts.pop();
      for(const part of parts){let event='',data='';
        for(const line of part.split('\n')){if(line.startsWith('event: '))event=line.slice(7);if(line.startsWith('data: '))data=line.slice(6)}
        if(!data)continue;const d=JSON.parse(data);
        if(event==='results'){currentResults=currentResults.concat(d.results);allSearchResults=allSearchResults.concat(d.results);renderResults()}
        else if(event==='done'){nextPage=d.next_page;totalSearchPages=d.total_pages}
      }
    }
  }catch(e){}
  prevBtnNav(startPage);updateSelCount();
}
function prevBtnNav(startPage){
  document.getElementById('prevPageBtn').disabled=startPage<=1;
  document.getElementById('nextPageBtn').disabled=startPage+3>totalSearchPages;
  document.getElementById('pageIndicator').textContent=`${startPage}–${Math.min(startPage+2,totalSearchPages)} / ${totalSearchPages} 页`;
  window.scrollTo(0,0);
  if(startPage+3<totalSearchPages)setTimeout(()=>preloadPages(startPage+3),500);
}
async function preloadPages(page){
  if(preloadCache[page])return;
  const safe=document.getElementById('safeMode').checked?1:0;
  try{
    const r=await fetch(`/api/search_stream?q=${encodeURIComponent(query)}&start_page=${page}&pages=3&safe=${safe}`);
    const reader=r.body.getReader();const decoder=new TextDecoder();let buffer='',results=[];
    while(true){const{done,value}=await reader.read();if(done)break;
      buffer+=decoder.decode(value,{stream:true});
      const parts=buffer.split('\n\n');buffer=parts.pop();
      for(const part of parts){let event='',data='';
        for(const line of part.split('\n')){if(line.startsWith('event: '))event=line.slice(7);if(line.startsWith('data: '))data=line.slice(6)}
        if(!data)continue;const d=JSON.parse(data);
        if(event==='results')results=results.concat(d.results);
      }
    }
    if(results.length)preloadCache[page]=results;
  }catch(e){}
}
async function startDownload(){
  if(!selected.size)return;document.getElementById('downloadBtn').disabled=true;
  const libR=await fetch('/api/library');const libD=await libR.json();
  const already=libD.items.filter(i=>selected.has(i.kurocore_id));
  if(already.length){
    const names=already.map(i=>`「${i.title||i.kurocore_id}」`).join('、');
    if(!confirm(`以下 ${already.length} 项已下载：\n${names}\n\n跳过重复项？`)){document.getElementById('downloadBtn').disabled=false;return}
    already.forEach(i=>selected.delete(i.kurocore_id));
    if(!selected.size){updateSelCount();return}updateSelCount();
  }
  const r=await fetch('/api/download',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({illust_ids:[...selected]})});
  const d=await r.json();
  if(d.error){alert(d.error);document.getElementById('downloadBtn').disabled=false;return}
  document.getElementById('progressBar').classList.add('active');pollProgress();
}
async function pollProgress(){
  const r=await fetch('/api/progress');const d=await r.json();
  if(!d.running){
    if(d.errors&&d.errors.length){
      document.getElementById('errorList').innerHTML=d.errors.map(e=>`<div class="error-item">${e.illust_id}: ${e.error||e.title||'失败'}</div>`).join('');
    }
    setTimeout(()=>{document.getElementById('progressBar').classList.remove('active');document.getElementById('downloadBtn').disabled=selected.size===0;fetchStats()},3000);
    return;
  }
  const pct=d.total?Math.round(d.done/d.total*100):0;
  document.getElementById('progressFill').style.width=pct+'%';
  document.getElementById('progressText').textContent=`${d.done}/${d.total} — ${d.current} (${d.session_downloads}/${d.session_max})`;
  document.getElementById('progressDetail').textContent=d.detail||'';
  if(d.error){const el=document.getElementById('errorList');if(!el.innerHTML.includes(d.error))el.innerHTML+=`<div class="error-item">⚠ ${d.error}</div>`}
  setTimeout(pollProgress,500);
}
async function autoDownload(){
  if(!allSearchResults.length)return;
  const libR=await fetch('/api/library');const libD=await libR.json();
  const done=new Set(libD.items.map(i=>i.kurocore_id));
  const toDl=allSearchResults.filter(r=>!done.has(r.illust_id)).map(r=>r.illust_id);
  if(!toDl.length){alert('已全部下载');return}
  if(!confirm(`下载全部 ${toDl.length} 项？`))return;
  selected.clear();toDl.forEach(id=>selected.add(id));updateSelCount();startDownload();
}
async function randomCollect(){
  if(!confirm('后台随机搜索并下载，不限数量。开始？'))return;
  document.getElementById('randomCollectBtn').disabled=true;
  const safe=isSafeMode();
  const r=await fetch('/api/random_collect',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({max:0,safe,per_tag:5})});
  const d=await r.json();
  if(d.error){alert(d.error);document.getElementById('randomCollectBtn').disabled=false;return}
  pollRandom();
}
async function pollRandom(){
  const r=await fetch('/api/progress');const d=await r.json();
  if(d.current&&d.current.includes('随机采集完成')){document.getElementById('randomCollectBtn').disabled=false;fetchStats();return}
  if(d.current)document.getElementById('progressText').textContent=d.current;
  document.getElementById('progressBar').classList.add('active');
  setTimeout(pollRandom,2000);
}
async function loadLibrary(){
  const r=await fetch('/api/library');const d=await r.json();
  const grid=document.getElementById('libraryGrid');
  const toolbar=document.getElementById('libToolbar');
  libSelected.clear();
  if(!d.items.length){toolbar.style.display='none';grid.innerHTML='<p style="color:var(--text3);grid-column:1/-1;text-align:center;padding:60px;font-size:14px">还没有下载图片</p>';return}
  toolbar.style.display='flex';
  document.getElementById('libInfo').textContent=`${d.total} 项`;
  grid.innerHTML='';
  d.items.forEach(item=>{
    const div=document.createElement('div');div.className='lib-item';div.dataset.id=item.kurocore_id;
    const tags=(item.tags||[]).slice(0,3).join(' · ');
    const img=item.thumb_url?`<img src="${item.thumb_url}" loading="lazy" onerror="this.style.display='none'">`:'';
    div.innerHTML=`<div class="check"></div>${img}<div class="lib-meta"><div class="t">${item.title||'Untitled'}</div><div class="a">${item.author_name||''}</div><div style="margin-top:4px"><a href="${item.pixiv_url}" target="_blank">Pixiv ↗</a></div></div>`;
    div.onclick=(e)=>{if(e.target.closest('a'))return;toggleLib(item.kurocore_id,div)};
    grid.appendChild(div);
  });
}
function toggleLib(id,el){if(libSelected.has(id)){libSelected.delete(id);el.classList.remove('selected')}else{libSelected.add(id);el.classList.add('selected')}document.getElementById('delCount').textContent=libSelected.size;document.getElementById('deleteSelBtn').disabled=libSelected.size===0}
function selectLibAll(){document.querySelectorAll('.lib-item').forEach(el=>{libSelected.add(el.dataset.id);el.classList.add('selected')});document.getElementById('delCount').textContent=libSelected.size;document.getElementById('deleteSelBtn').disabled=false}
function deselectLibAll(){libSelected.clear();document.querySelectorAll('.lib-item.selected').forEach(el=>el.classList.remove('selected'));document.getElementById('delCount').textContent=0;document.getElementById('deleteSelBtn').disabled=true}
async function deleteSelected(){
  if(!libSelected.size)return;if(!confirm(`删除 ${libSelected.size} 项？`))return;
  for(const id of libSelected)await fetch(`/api/delete?id=${id}`);
  libSelected.clear();loadLibrary();fetchStats();
}
async function clearAll(){
  if(!confirm('删除全部？'))return;
  await fetch('/api/clear_all');loadLibrary();fetchStats();
}
async function loadContact(){

function isSafeMode(){return document.getElementById('safeMode').checked}

async function loadHotTags(){
  const r=await fetch('/api/hot_tags');const d=await r.json();

function doRandom(){
  let pool=[];
  if(allTags.length)pool=allTags;
  else{const chips=document.querySelectorAll('.chip:not(.history)');pool=[...chips].map(c=>c.textContent)}
  if(!pool.length){alert('标签加载中');return}
  if(isSafeMode())pool=pool.filter(t=>!t.toLowerCase().includes('r-18'));
  const tag=pool[Math.floor(Math.random()*pool.length)];
  document.getElementById('searchInput').value=tag;doSearch();
}
const girlBase='女の子';
const girlModifiers=['美少女','銀髪','金髪','ツインテール','ポニーテール','猫耳','セーラー服','メイド','巫女','JK','ギャル','お姉さん','妹','ロングヘア','ショートカット','赤髪','白髪','アイドル','着物','チャイナドレス','スクール水着','ゴスロリ'];
function doRandomGirl(){
  const safe=isSafeMode();
  const nsfw=new Set(['ロリ','おっぱい','巨乳']);
  const pool=safe?girlModifiers.filter(t=>!nsfw.has(t)):girlModifiers;
  const mod=pool[Math.floor(Math.random()*pool.length)];
  document.getElementById('searchInput').value=`${girlBase} ${mod}`;doSearch();
}
let allTags=[],suggestIdx=-1;
async function loadSuggest(){
  try{const r=await fetch('/api/suggest');const d=await r.json();allTags=d.tags||[]}catch(e){}
}
loadSuggest();
document.getElementById('searchInput').addEventListener('input',function(){
  const q=this.value.trim().toLowerCase();const box=document.getElementById('suggestBox');suggestIdx=-1;
  if(!q||!allTags.length){box.classList.remove('active');return}
  const matches=allTags.filter(t=>t.toLowerCase().includes(q)).slice(0,10);
  if(!matches.length){box.classList.remove('active');return}
  box.innerHTML='';
  matches.forEach(t=>{const div=document.createElement('div');div.className='suggest-item';div.textContent=t;
    div.onclick=()=>{this.value=t;box.classList.remove('active');doSearch()};box.appendChild(div)});
  box.classList.add('active');
});
document.getElementById('searchInput').addEventListener('keydown',function(e){
  const box=document.getElementById('suggestBox');const items=box.querySelectorAll('.suggest-item');
  if(!box.classList.contains('active')||!items.length)return;
  if(e.key==='ArrowDown'){e.preventDefault();suggestIdx=Math.min(suggestIdx+1,items.length-1)}
  else if(e.key==='ArrowUp'){e.preventDefault();suggestIdx=Math.max(suggestIdx-1,0)}
  else if(e.key==='Enter'&&suggestIdx>=0){e.preventDefault();this.value=items[suggestIdx].textContent;box.classList.remove('active');doSearch();return}
  else if(e.key==='Escape'){box.classList.remove('active');return}
  items.forEach((el,i)=>el.classList.toggle('hl',i===suggestIdx));
});
document.addEventListener('click',e=>{if(!e.target.closest('.search-wrap'))document.getElementById('suggestBox').classList.remove('active')});
fetchStats();loadHotTags();loadHistory();
